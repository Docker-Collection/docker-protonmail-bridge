name: Docker

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 16 * * 1"
  push:
    branches:
      - main
    paths:
      - Dockerfile
  pull_request:
    paths:
      - Dockerfile

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker build
    uses: Docker-Collection/reusable-workflows/.github/workflows/docker-build.yml@48ebc9edaee6ee6d03335dfd37fd9abf1abd5fb0 # main
    with:
      docker_name: "ghcr.io/docker-collection/protonmail-bridge"
      docker_label_author: "Efina"
      docker_label_title: "ProtonMail Bridge For ARM!"
      docker_label_description: "ProtonMail Bridge ARM"
